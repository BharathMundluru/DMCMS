<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>DMCMS | Cage Details</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <style>

        body {
            background-color: #f4f7f9;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background: #16324f;
        }

        .navbar-brand {
            font-weight: bold;
            color: white !important;
        }

        .page-title {
            margin-top: 40px;
            color: #16324f;
            font-weight: bold;
        }

        .details-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-top: 25px;
            margin-bottom: 40px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .detail-label {
            font-weight: bold;
            color: #16324f;
        }

        .detail-value {
            color: #555;
        }

    </style>

</head>

<body>

<nav class="navbar">

    <div class="container">

        <a class="navbar-brand"
           href="/dashboard">

            🐭 DMCMS

        </a>

        <a href="/cages"
           class="text-white text-decoration-none">

            Cages

        </a>

    </div>

</nav>


<div class="container">

    <h1 class="page-title">

        🏠 Cage Details

    </h1>


    <div class="details-card">


        <!-- ID -->

        <div class="row mb-3">

            <div class="col-md-4 detail-label">
                ID
            </div>

            <div class="col-md-8 detail-value"
                 th:text="${cage.id}">

                1

            </div>

        </div>


        <!-- CAGE NUMBER -->

        <div class="row mb-3">

            <div class="col-md-4 detail-label">
                Cage Number
            </div>

            <div class="col-md-8 detail-value"
                 th:text="${cage.cageNumber}">

                C001

            </div>

        </div>


        <!-- RACK -->

        <div class="row mb-3">

            <div class="col-md-4 detail-label">
                Rack
            </div>

            <div class="col-md-8 detail-value"
                 th:text="${cage.rack}">

                R1

            </div>

        </div>


        <!-- ROOM -->

        <div class="row mb-3">

            <div class="col-md-4 detail-label">
                Room
            </div>

            <div class="col-md-8 detail-value"
                 th:text="${cage.room}">

                Room 101

            </div>

        </div>


        <!-- CAPACITY -->

        <div class="row mb-3">

            <div class="col-md-4 detail-label">
                Capacity
            </div>

            <div class="col-md-8 detail-value"
                 th:text="${cage.capacity}">

                5

            </div>

        </div>


        <!-- OCCUPANCY -->

        <div class="row mb-4">

            <div class="col-md-4 detail-label">
                Occupancy
            </div>

            <div class="col-md-8 detail-value"
                 th:text="${cage.occupancy}">

                3

            </div>

        </div>


        <div class="d-flex gap-2">

            <a
                    href="/cages"
                    class="btn btn-secondary">

                Back

            </a>

            <a
                    th:href="@{/cages/delete/{id}(id=${cage.id})}"
                    class="btn btn-danger"
                    onclick="return confirm('Delete this cage?')">

                Delete

            </a>

        </div>

    </div>

</div>

</body>

</html>
