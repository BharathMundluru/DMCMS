<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>DMCMS | Mice</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

</head>

<body class="bg-light">


<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg" style="background:#16324f;">

    <div class="container">

        <!-- Logo / Brand -->
        <a class="navbar-brand fw-bold text-white"
           href="/dashboard">

            🐭 DMCMS

        </a>

        <!-- Navigation Links -->
        <div class="navbar-nav ms-auto">

            <a class="nav-link text-white"
               href="/dashboard">

                Dashboard

            </a>

            <a class="nav-link text-white"
               href="/mice">

                Mice

            </a>

            <a class="nav-link text-white"
               href="/colonies">

                Colonies

            </a>

            <a class="nav-link text-white"
               href="/cages">

                Cages

            </a>

            <a class="nav-link text-white"
               href="/breeding">

                Breeding

            </a>

            <a class="nav-link text-white"
               href="/health">

                Health

            </a>

            <a class="nav-link text-white"
               href="/inventory">

                Inventory

            </a>

            <a class="nav-link text-white"
               href="/experiments">

                Experiments

            </a>

        </div>

    </div>

</nav>


<div class="container-fluid mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>

            🐭 Mouse Management

        </h2>

        <div class="card shadow-sm mb-4">

            <div class="card-body">

                <div class="row g-3">

                    <!-- Search by Barcode -->
                    <div class="col-md-6">

                        <form th:action="@{/mice/search/barcode}"
                              method="get">

                            <label class="form-label fw-bold">
                                Search by Barcode
                            </label>

                            <div class="input-group">

                                <input type="text"
                                       name="barcode"
                                       class="form-control"
                                       placeholder="Enter barcode">

                                <button type="submit"
                                        class="btn btn-primary">

                                    🔍 Search

                                </button>

                            </div>

                        </form>

                    </div>


                    <!-- Search by Strain -->
                    <div class="col-md-6">

                        <form th:action="@{/mice/search/strain}"
                              method="get">

                            <label class="form-label fw-bold">
                                Search by Strain
                            </label>

                            <div class="input-group">

                                <input type="text"
                                       name="strain"
                                       class="form-control"
                                       placeholder="Enter strain">

                                <button type="submit"
                                        class="btn btn-primary">

                                    🔍 Search

                                </button>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>

        <a
                href="/mice/add"
                class="btn btn-primary">

            Add New Mouse

        </a>

    </div>


    <div class="card shadow">

        <div class="card-body">

            <div class="table-responsive">

                <table class="table table-hover align-middle">

                    <thead class="table-dark">

                    <tr>

                        <th>ID</th>

                        <th>Mouse ID</th>

                        <th>Gender</th>

                        <th>Strain</th>

                        <th>Date of Birth</th>

                        <th>Status</th>

                        <th>Barcode</th>

                        <th>RFID</th>

                        <th>Actions</th>

                    </tr>

                    </thead>


                    <tbody>

                    <tr th:each="mouse : ${mice}">

                        <td th:text="${mouse.id}">
                            1
                        </td>

                        <td>

                            <strong
                                    th:text="${mouse.mouseId}">

                                M001

                            </strong>

                        </td>

                        <td th:text="${mouse.gender}">
                            Male
                        </td>

                        <td th:text="${mouse.strain}">
                            C57BL/6
                        </td>

                        <td th:text="${mouse.dateOfBirth}">
                            2026-01-01
                        </td>

                        <td>

                            <span
                                    class="badge bg-success"
                                    th:text="${mouse.status}">

                                ACTIVE

                            </span>

                        </td>

                        <td th:text="${mouse.barcode}">
                            -
                        </td>

                        <td th:text="${mouse.rfid}">
                            -
                        </td>

                        <td>

                            <a
                                    th:href="@{/mice/view/{id}(id=${mouse.id})}"
                                    class="btn btn-sm btn-primary">

                                View

                            </a>

                            <a th:href="@{/mice/family/{id}(id=${mouse.id})}"
                               class="btn btn-sm btn-info">

                                Family Tree

                            </a>

                            <a th:href="@{/mice/edit/{id}(id=${mouse.id})}"
                               class="btn btn-warning btn-sm">

                                Edit

                            </a>

                            <a
                                    th:href="@{/mice/delete/{id}(id=${mouse.id})}"
                                    class="btn btn-sm btn-danger"
                                    onclick="return confirm('Delete this mouse?');">

                                Delete

                            </a>

                        </td>

                    </tr>


                    <tr th:if="${#lists.isEmpty(mice)}">

                        <td
                                colspan="9"
                                class="text-center py-5">

                            No mice registered yet.

                            <br>

                            <a
                                    href="/mice/add"
                                    class="btn btn-success mt-3">

                                Add First Mouse

                            </a>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

</body>

</html>
