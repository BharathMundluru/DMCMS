<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>DMCMS | Add Cage</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <style>

        body {
            background-color: #f4f7f9;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background: #16324f;
        }

        .navbar-brand {
            font-weight: bold;
            color: white !important;
        }

        .form-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-top: 40px;
            margin-bottom: 40px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .page-title {
            color: #16324f;
            font-weight: bold;
        }

        .form-label {
            color: #16324f;
            font-weight: bold;
        }

    </style>

</head>

<body>

<nav class="navbar">

    <div class="container">

        <a class="navbar-brand"
           href="/dashboard">

            🐭 DMCMS

        </a>

        <a href="/cages"
           class="text-white text-decoration-none">

            Cages

        </a>

    </div>

</nav>


<div class="container">

    <div class="form-card">

        <h1 class="page-title mb-4">

            🏠 Add Cage

        </h1>


        <form
                th:action="@{/cages/save}"
                th:object="${cage}"
                method="post">


            <!-- CAGE NUMBER -->

            <div class="mb-3">

                <label class="form-label">

                    Cage Number

                </label>

                <input
                        type="text"
                        class="form-control"
                        th:field="*{cageNumber}"
                        placeholder="Enter cage number"
                        required>

            </div>


            <!-- RACK -->

            <div class="mb-3">

                <label class="form-label">

                    Rack

                </label>

                <input
                        type="text"
                        class="form-control"
                        th:field="*{rack}"
                        placeholder="Enter rack">

            </div>


            <!-- ROOM -->

            <div class="mb-3">

                <label class="form-label">

                    Room

                </label>

                <input
                        type="text"
                        class="form-control"
                        th:field="*{room}"
                        placeholder="Enter room">

            </div>


            <div class="row">

                <!-- CAPACITY -->

                <div class="col-md-6 mb-3">

                    <label class="form-label">

                        Capacity

                    </label>

                    <input
                            type="number"
                            class="form-control"
                            th:field="*{capacity}"
                            min="0"
                            required>

                </div>


                <!-- OCCUPANCY -->

                <div class="col-md-6 mb-3">

                    <label class="form-label">

                        Occupancy

                    </label>

                    <input
                            type="number"
                            class="form-control"
                            th:field="*{occupancy}"
                            min="0"
                            required>

                </div>

            </div>


            <div class="d-flex gap-2">

                <button
                        type="submit"
                        class="btn btn-primary">

                    Save Cage

                </button>

                <a
                        href="/cages"
                        class="btn btn-secondary">

                    Cancel

                </a>

            </div>

        </form>

    </div>

</div>

</body>

</html>
