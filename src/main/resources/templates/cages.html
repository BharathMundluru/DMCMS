<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>DMCMS | Cages</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <style>

        body {
            background-color: #f4f7f9;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background: #16324f;
        }

        .navbar-brand {
            font-weight: bold;
            color: white !important;
        }

        .navbar .nav-link {
            color: #dce6ef !important;
            margin-left: 10px;
        }

        .navbar .nav-link:hover {
            color: white !important;
        }

        .page-title {
            margin-top: 40px;
            color: #16324f;
            font-weight: bold;
        }

        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .table {
            margin-bottom: 0;
        }

        .table th {
            background-color: #16324f;
            color: white;
        }

        .table td {
            vertical-align: middle;
        }

    </style>

</head>

<body>

<!-- NAVBAR -->

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg" style="background:#16324f;">

    <div class="container">

        <!-- Logo / Brand -->
        <a class="navbar-brand fw-bold text-white"
           href="/dashboard">

            🐭 DMCMS

        </a>

        <!-- Navigation Links -->
        <div class="navbar-nav ms-auto">

            <a class="nav-link text-white"
               href="/dashboard">

                Dashboard

            </a>

            <a class="nav-link text-white"
               href="/mice">

                Mice

            </a>

            <a class="nav-link text-white"
               href="/colonies">

                Colonies

            </a>

            <a class="nav-link text-white"
               href="/cages">

                Cages

            </a>

            <a class="nav-link text-white"
               href="/breeding">

                Breeding

            </a>

            <a class="nav-link text-white"
               href="/health">

                Health

            </a>

            <a class="nav-link text-white"
               href="/inventory">

                Inventory

            </a>

            <a class="nav-link text-white"
               href="/experiments">

                Experiments

            </a>

        </div>

    </div>

</nav>


<!-- MAIN -->

<div class="container">

    <div class="d-flex justify-content-between align-items-center">

        <h1 class="page-title">

            🏠 Cages

        </h1>

        <a href="/cages/add"
           class="btn btn-primary">

            + Add Cage

        </a>

    </div>


    <div class="card mt-4">

        <div class="card-body p-0">

            <div class="table-responsive">

                <table class="table table-hover">

                    <thead>

                    <tr>

                        <th>ID</th>

                        <th>Cage Number</th>

                        <th>Rack</th>

                        <th>Room</th>

                        <th>Capacity</th>

                        <th>Occupancy</th>

                        <th>Action</th>

                    </tr>

                    </thead>

                    <tbody>

                    <tr th:each="cage : ${cages}">

                        <td th:text="${cage.id}">
                            1
                        </td>

                        <td th:text="${cage.cageNumber}">
                            C001
                        </td>

                        <td th:text="${cage.rack}">
                            R1
                        </td>

                        <td th:text="${cage.room}">
                            Room 101
                        </td>

                        <td th:text="${cage.capacity}">
                            5
                        </td>

                        <td th:text="${cage.occupancy}">
                            3
                        </td>

                        <td>

                            <a
                                    th:href="@{/cages/view/{id}(id=${cage.id})}"
                                    class="btn btn-sm btn-primary">

                                View

                            </a>

                            <a
                                    th:href="@{/cages/delete/{id}(id=${cage.id})}"
                                    class="btn btn-sm btn-danger"
                                    onclick="return confirm('Delete this cage?')">

                                Delete

                            </a>

                        </td>

                    </tr>


                    <tr th:if="${#lists.isEmpty(cages)}">

                        <td colspan="7"
                            class="text-center p-4">

                            No cages found.

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

</body>

</html>
