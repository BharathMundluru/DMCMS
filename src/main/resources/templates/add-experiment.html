<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>DMCMS | Add Experiment</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <style>

        body {
            background-color: #f4f7f9;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background: #16324f;
        }

        .navbar-brand {
            font-weight: bold;
            color: white !important;
        }

        .navbar .nav-link {
            color: #dce6ef !important;
        }

        .form-card {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            margin-top: 40px;
            margin-bottom: 40px;
        }

        .page-title {
            color: #16324f;
            font-weight: bold;
            margin-bottom: 30px;
        }

    </style>

</head>

<body>

<nav class="navbar navbar-expand-lg">

    <div class="container">

        <a class="navbar-brand"
           href="/dashboard">

            🐭 DMCMS

        </a>

        <div class="navbar-nav ms-auto">

            <a class="nav-link"
               href="/dashboard">

                Dashboard

            </a>

            <a class="nav-link"
               href="/experiments">

                Experiments

            </a>

        </div>

    </div>

</nav>


<div class="container">

    <div class="form-card">

        <h1 class="page-title">

            Add Experiment

        </h1>


        <form
                th:action="@{/experiments/save}"
                th:object="${experiment}"
                method="post">


            <!-- MOUSE -->

            <div class="mb-3">

                <label class="form-label">
                    Mouse
                </label>

                <select
                        class="form-select"
                        th:field="*{mouse}"
                        required>

                    <option value="">
                        Select Mouse
                    </option>

                    <option
                            th:each="mouse : ${mice}"
                            th:value="${mouse.id}"
                            th:text="${mouse.mouseId}">

                        M001

                    </option>

                </select>

            </div>


            <!-- PROJECT NAME -->

            <div class="mb-3">

                <label class="form-label">
                    Project Name
                </label>

                <input
                        type="text"
                        class="form-control"
                        th:field="*{projectName}"
                        required>

            </div>


            <!-- PROTOCOL -->

            <div class="mb-3">

                <label class="form-label">
                    Protocol Number
                </label>

                <input
                        type="text"
                        class="form-control"
                        th:field="*{protocolNumber}">

            </div>


            <!-- RESEARCHER -->

            <div class="mb-3">

                <label class="form-label">
                    Researcher
                </label>

                <input
                        type="text"
                        class="form-control"
                        th:field="*{researcher}">

            </div>


            <!-- START DATE -->

            <div class="mb-3">

                <label class="form-label">
                    Start Date
                </label>

                <input
                        type="date"
                        class="form-control"
                        th:field="*{startDate}">

            </div>


            <!-- END DATE -->

            <div class="mb-3">

                <label class="form-label">
                    End Date
                </label>

                <input
                        type="date"
                        class="form-control"
                        th:field="*{endDate}">

            </div>


            <!-- RESULT -->

            <div class="mb-3">

                <label class="form-label">
                    Result
                </label>

                <textarea
                        class="form-control"
                        rows="5"
                        th:field="*{result}">
                </textarea>

            </div>


            <!-- STATUS -->

            <div class="mb-4">

                <label class="form-label">
                    Status
                </label>

                <select
                        class="form-select"
                        th:field="*{status}">

                    <option value="">
                        Select Status
                    </option>

                    <option value="PLANNED">
                        Planned
                    </option>

                    <option value="ONGOING">
                        Ongoing
                    </option>

                    <option value="COMPLETED">
                        Completed
                    </option>

                    <option value="CANCELLED">
                        Cancelled
                    </option>

                </select>

            </div>


            <button
                    type="submit"
                    class="btn btn-primary">

                Save Experiment

            </button>

            <a
                    href="/experiments"
                    class="btn btn-secondary">

                Cancel

            </a>

        </form>

    </div>

</div>

</body>

</html>
