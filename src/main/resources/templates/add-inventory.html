<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>DMCMS | Add Inventory</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <style>

        body {
            background-color: #f4f7f9;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background: #16324f;
        }

        .navbar-brand {
            font-weight: bold;
            color: white !important;
        }

        .navbar .nav-link {
            color: #dce6ef !important;
        }

        .form-card {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            margin-top: 40px;
            margin-bottom: 40px;
        }

        .page-title {
            color: #16324f;
            font-weight: bold;
            margin-bottom: 30px;
        }

    </style>

</head>

<body>

<nav class="navbar navbar-expand-lg">

    <div class="container">

        <a class="navbar-brand" href="/dashboard">
            🐭 DMCMS
        </a>

        <div class="navbar-nav ms-auto">

            <a class="nav-link" href="/dashboard">
                Dashboard
            </a>

            <a class="nav-link" href="/inventory">
                Inventory
            </a>

        </div>

    </div>

</nav>


<div class="container">

    <div class="form-card">

        <h1 class="page-title">
            Add Inventory Item
        </h1>

        <form
                th:action="@{/inventory/save}"
                th:object="${inventory}"
                method="post">

            <div class="mb-3">

                <label class="form-label">
                    Item Name
                </label>

                <input
                        type="text"
                        class="form-control"
                        th:field="*{itemName}"
                        required>

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Quantity
                </label>

                <input
                        type="number"
                        class="form-control"
                        th:field="*{quantity}"
                        min="0">

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Minimum Quantity
                </label>

                <input
                        type="number"
                        class="form-control"
                        th:field="*{minimumQuantity}"
                        min="0">

            </div>


            <div class="mb-4">

                <label class="form-label">
                    Unit
                </label>

                <input
                        type="text"
                        class="form-control"
                        th:field="*{unit}"
                        placeholder="Boxes, pieces, bottles, etc.">

            </div>


            <button
                    type="submit"
                    class="btn btn-primary">

                Save Item

            </button>

            <a
                    href="/inventory"
                    class="btn btn-secondary">

                Cancel

            </a>

        </form>

    </div>

</div>

</body>

</html>
