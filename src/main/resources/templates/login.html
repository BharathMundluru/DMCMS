<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Login | DMCMS</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <style>

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #eef7f1, #dcefe3);
        }

        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            width: 100%;
            max-width: 450px;
            border: none;
            border-radius: 15px;
            overflow: hidden;
        }

        .login-header {
            background: #198754;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .login-header h2 {
            margin: 0;
            font-weight: 600;
        }

        .login-header p {
            margin: 8px 0 0;
            opacity: 0.9;
        }

        .form-control {
            padding: 12px;
            border-radius: 8px;
        }

        .form-control:focus {
            border-color: #198754;
            box-shadow: 0 0 0 0.2rem rgba(25, 135, 84, 0.15);
        }

        .login-btn {
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
        }

        .register-link {
            text-decoration: none;
            color: #198754;
            font-weight: 500;
        }

        .register-link:hover {
            text-decoration: underline;
        }

    </style>

</head>

<body>

<div class="container login-container">

    <div class="card shadow login-card">

        <!-- Header -->

        <div class="login-header">

            <h2>DMCMS</h2>

            <p>
                Digital Mouse Colony Management System
            </p>

        </div>


        <!-- Login Body -->

        <div class="card-body p-4">

            <h4 class="text-center mb-4">
                Sign In
            </h4>


            <!-- Registration Success -->

            <div
                    th:if="${param.registered}"
                    class="alert alert-success"
                    role="alert">

                Registration successful!
                Please login with your new account.

            </div>


            <!-- Login Error -->

            <div
                    th:if="${param.error}"
                    class="alert alert-danger"
                    role="alert">

                Invalid username or password.

            </div>


            <!-- Logout Message -->

            <div
                    th:if="${param.logout}"
                    class="alert alert-info"
                    role="alert">

                You have been logged out successfully.

            </div>


            <!-- Login Form -->

            <form
                    th:action="@{/login}"
                    method="post">

                <!-- CSRF Token -->

                <input
                        type="hidden"
                        th:name="${_csrf.parameterName}"
                        th:value="${_csrf.token}">


                <!-- Username -->

                <div class="mb-3">

                    <label
                            for="username"
                            class="form-label">

                        Username

                    </label>

                    <input
                            type="text"
                            id="username"
                            name="username"
                            class="form-control"
                            placeholder="Enter username"
                            autocomplete="username"
                            required>

                </div>


                <!-- Password -->

                <div class="mb-3">

                    <label
                            for="password"
                            class="form-label">

                        Password

                    </label>

                    <input
                            type="password"
                            id="password"
                            name="password"
                            class="form-control"
                            placeholder="Enter password"
                            autocomplete="current-password"
                            required>

                </div>


                <!-- Login Button -->

                <button
                        type="submit"
                        class="btn btn-success w-100 login-btn">

                    Login

                </button>

            </form>


            <!-- Register Link -->

            <div class="text-center mt-4">

                <span>
                    Don't have an account?
                </span>

                <a
                        th:href="@{/register}"
                        class="register-link">

                    Create an account

                </a>

            </div>

        </div>

    </div>

</div>


<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
