<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>DMCMS | Breeding Details</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

</head>


<body class="bg-light">


<!-- ================= NAVBAR ================= -->

<nav class="navbar navbar-dark"
     style="background:#16324f;">

    <div class="container">

        <a class="navbar-brand"
           href="/dashboard">

            🐭 DMCMS

        </a>


        <a
                href="/breeding"
                class="btn btn-outline-light">

            Back to Breeding

        </a>

    </div>

</nav>



<!-- ================= MAIN ================= -->

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow">

                <div class="card-body p-4">


                    <h2 class="mb-4">

                        🧬 Breeding Details

                    </h2>



                    <div class="row">


                        <!-- ================= RECORD ID ================= -->

                        <div class="col-md-6 mb-3">

                            <strong>
                                Record ID
                            </strong>

                            <p
                                    class="form-control bg-light"
                                    th:text="${breeding.id}">

                                1

                            </p>

                        </div>



                        <!-- ================= STATUS ================= -->

                        <div class="col-md-6 mb-3">

                            <strong>
                                Status
                            </strong>

                            <p>

                                <span
                                        class="badge bg-success"
                                        th:if="${breeding.status == 'COMPLETED'}"
                                        th:text="${breeding.status}">

                                    COMPLETED

                                </span>


                                <span
                                        class="badge bg-warning text-dark"
                                        th:if="${breeding.status == 'PENDING'}"
                                        th:text="${breeding.status}">

                                    PENDING

                                </span>


                                <span
                                        class="badge bg-primary"
                                        th:if="${breeding.status == 'ACTIVE'}"
                                        th:text="${breeding.status}">

                                    ACTIVE

                                </span>


                                <span
                                        class="badge bg-secondary"
                                        th:if="${breeding.status != 'COMPLETED'
                                               and breeding.status != 'PENDING'
                                               and breeding.status != 'ACTIVE'}"
                                        th:text="${breeding.status}">

                                    -

                                </span>

                            </p>

                        </div>



                        <!-- ================= MALE MOUSE ================= -->

                        <div class="col-md-6 mb-3">

                            <strong>
                                Male Mouse
                            </strong>

                            <p
                                    class="form-control bg-light"
                                    th:if="${breeding.maleMouse != null}"
                                    th:text="${breeding.maleMouse.mouseId}">

                                M001

                            </p>


                            <p
                                    class="form-control bg-light"
                                    th:unless="${breeding.maleMouse != null}">

                                Not assigned

                            </p>

                        </div>



                        <!-- ================= FEMALE MOUSE ================= -->

                        <div class="col-md-6 mb-3">

                            <strong>
                                Female Mouse
                            </strong>

                            <p
                                    class="form-control bg-light"
                                    th:if="${breeding.femaleMouse != null}"
                                    th:text="${breeding.femaleMouse.mouseId}">

                                F001

                            </p>


                            <p
                                    class="form-control bg-light"
                                    th:unless="${breeding.femaleMouse != null}">

                                Not assigned

                            </p>

                        </div>



                        <!-- ================= MATING DATE ================= -->

                        <div class="col-md-6 mb-3">

                            <strong>
                                Mating Date
                            </strong>

                            <p
                                    class="form-control bg-light"
                                    th:text="${breeding.matingDate != null
                                             ? breeding.matingDate
                                             : 'Not recorded'}">

                                2026-08-20

                            </p>

                        </div>



                        <!-- ================= BIRTH DATE ================= -->

                        <div class="col-md-6 mb-3">

                            <strong>
                                Birth Date
                            </strong>

                            <p
                                    class="form-control bg-light"
                                    th:text="${breeding.birthDate != null
                                             ? breeding.birthDate
                                             : 'Not recorded'}">

                                2026-08-30

                            </p>

                        </div>



                        <!-- ================= LITTER SIZE ================= -->

                        <div class="col-md-6 mb-3">

                            <strong>
                                Litter Size
                            </strong>

                            <p
                                    class="form-control bg-light"
                                    th:text="${breeding.litterSize != null
                                             ? breeding.litterSize
                                             : 'Not recorded'}">

                                8

                            </p>

                        </div>



                        <!-- ================= WEANING DATE ================= -->

                        <div class="col-md-6 mb-3">

                            <strong>
                                Weaning Date
                            </strong>

                            <p
                                    class="form-control bg-light"
                                    th:text="${breeding.weaningDate != null
                                             ? breeding.weaningDate
                                             : 'Not recorded'}">

                                2026-09-20

                            </p>

                        </div>


                    </div>



                    <hr>



                    <!-- ================= ACTIONS ================= -->

                    <div class="mt-3">


                        <a
                                th:href="@{/breeding/edit/{id}(id=${breeding.id})}"
                                class="btn btn-warning me-2">

                            ✏️ Edit

                        </a>


                        <a
                                th:href="@{/breeding/delete/{id}(id=${breeding.id})}"
                                class="btn btn-danger me-2"
                                onclick="return confirm('Are you sure you want to delete this breeding record?');">

                            🗑 Delete

                        </a>


                        <a
                                href="/breeding"
                                class="btn btn-secondary">

                            Back

                        </a>

                    </div>


                </div>

            </div>

        </div>

    </div>

</div>


<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


</body>

</html>
