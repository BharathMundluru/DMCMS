<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>DMCMS | Breeding</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

</head>


<body class="bg-light">


<!-- ================= NAVBAR ================= -->

<nav class="navbar navbar-dark"
     style="background:#16324f;">

    <div class="container">

        <a class="navbar-brand"
           href="/dashboard">

            🐭 DMCMS

        </a>


        <div>

            <a href="/dashboard"
               class="btn btn-outline-light me-2">

                Dashboard

            </a>


            <a href="/mice"
               class="btn btn-outline-light me-2">

                Mice

            </a>


            <a href="/breeding"
               class="btn btn-outline-light">

                Breeding

            </a>

        </div>

    </div>

</nav>


<!-- ================= MAIN ================= -->

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow">

                <div class="card-body p-4">


                    <!-- ================= TITLE ================= -->

                    <h2 class="mb-4"
                        th:if="${breeding.id == null}">

                        🧬 Add New Breeding Record

                    </h2>


                    <h2 class="mb-4"
                        th:if="${breeding.id != null}">

                        🧬 Edit Breeding Record

                    </h2>



                    <!-- ================= FORM ================= -->

                    <form
                            th:action="@{/breeding/save}"
                            th:object="${breeding}"
                            method="post">


                        <!-- Hidden ID -->

                        <input
                                type="hidden"
                                th:field="*{id}">



                        <div class="row">


                            <!-- ================= MALE ================= -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label">

                                    Male Mouse

                                </label>


                                <select
                                        th:field="*{maleMouse}"
                                        class="form-select"
                                        required>

                                    <option value="">

                                        Select Male Mouse

                                    </option>


                                    <option
                                            th:each="mouse : ${maleMice}"
                                            th:value="${mouse.id}"
                                            th:text="${mouse.mouseId}">

                                    </option>

                                </select>

                            </div>



                            <!-- ================= FEMALE ================= -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label">

                                    Female Mouse

                                </label>


                                <select
                                        th:field="*{femaleMouse}"
                                        class="form-select"
                                        required>

                                    <option value="">

                                        Select Female Mouse

                                    </option>


                                    <option
                                            th:each="mouse : ${femaleMice}"
                                            th:value="${mouse.id}"
                                            th:text="${mouse.mouseId}">

                                    </option>

                                </select>

                            </div>



                            <!-- ================= MATING DATE ================= -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label">

                                    Mating Date

                                </label>


                                <input
                                        type="date"
                                        th:field="*{matingDate}"
                                        class="form-control">

                            </div>



                            <!-- ================= BIRTH DATE ================= -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label">

                                    Birth Date

                                </label>


                                <input
                                        type="date"
                                        th:field="*{birthDate}"
                                        class="form-control">

                            </div>



                            <!-- ================= LITTER SIZE ================= -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label">

                                    Litter Size

                                </label>


                                <input
                                        type="number"
                                        min="0"
                                        th:field="*{litterSize}"
                                        class="form-control"
                                        placeholder="Example: 8">

                            </div>



                            <!-- ================= WEANING DATE ================= -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label">

                                    Weaning Date

                                </label>


                                <input
                                        type="date"
                                        th:field="*{weaningDate}"
                                        class="form-control">

                            </div>



                            <!-- ================= STATUS ================= -->

                            <div class="col-md-12 mb-3">

                                <label class="form-label">

                                    Status

                                </label>


                                <select
                                        th:field="*{status}"
                                        class="form-select">

                                    <option value="">

                                        Select Status

                                    </option>


                                    <option value="PENDING">

                                        Pending

                                    </option>


                                    <option value="ACTIVE">

                                        Active

                                    </option>


                                    <option value="COMPLETED">

                                        Completed

                                    </option>


                                    <option value="CANCELLED">

                                        Cancelled

                                    </option>

                                </select>

                            </div>


                        </div>



                        <!-- ================= BUTTONS ================= -->

                        <div class="mt-4">


                            <button
                                    type="submit"
                                    class="btn btn-success me-2"
                                    th:if="${breeding.id == null}">

                                💾 Save Breeding

                            </button>


                            <button
                                    type="submit"
                                    class="btn btn-primary me-2"
                                    th:if="${breeding.id != null}">

                                💾 Update Breeding

                            </button>


                            <a
                                    href="/breeding"
                                    class="btn btn-secondary">

                                Cancel

                            </a>

                        </div>


                    </form>

                </div>

            </div>

        </div>

    </div>

</div>


<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


</body>

</html>
