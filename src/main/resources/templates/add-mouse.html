<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>DMCMS | Mouse</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

</head>


<body class="bg-light">


<!-- ================= NAVBAR ================= -->

<nav class="navbar navbar-dark"
     style="background:#16324f;">

    <div class="container">

        <a class="navbar-brand"
           href="/dashboard">

            🐭 DMCMS

        </a>


        <div>

            <a href="/dashboard"
               class="btn btn-outline-light me-2">

                Dashboard

            </a>


            <a href="/mice"
               class="btn btn-outline-light">

                Mice

            </a>

        </div>

    </div>

</nav>



<!-- ================= MAIN ================= -->

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-lg-9">

            <div class="card shadow">

                <div class="card-body p-4">


                    <!-- ================= TITLE ================= -->

                    <h2 class="mb-4">

                        🐭
                        <span th:if="${mouse.id == null}">
                            Add New Mouse
                        </span>

                        <span th:if="${mouse.id != null}">
                            Edit Mouse
                        </span>

                    </h2>



                    <!-- ================= ERROR ================= -->

                    <div
                            th:if="${error}"
                            class="alert alert-danger"
                            th:text="${error}">
                    </div>



                    <!-- ================= SUCCESS ================= -->

                    <div
                            th:if="${success}"
                            class="alert alert-success"
                            th:text="${success}">
                    </div>



                    <!-- ================= FORM ================= -->

                    <form
                            th:action="@{/mice/save}"
                            th:object="${mouse}"
                            method="post"
                            enctype="multipart/form-data">


                        <!-- Hidden ID -->

                        <input
                                type="hidden"
                                th:field="*{id}">



                        <div class="row">


                            <!-- ================= MOUSE ID ================= -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label">

                                    Mouse ID

                                </label>

                                <input
                                        type="text"
                                        th:field="*{mouseId}"
                                        class="form-control"
                                        placeholder="Example: M001"
                                        required>

                            </div>



                            <!-- ================= GENDER ================= -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label">

                                    Gender

                                </label>

                                <select
                                        th:field="*{gender}"
                                        class="form-select"
                                        required>

                                    <option value="">
                                        Select Gender
                                    </option>

                                    <option value="MALE">
                                        Male
                                    </option>

                                    <option value="FEMALE">
                                        Female
                                    </option>

                                </select>

                            </div>



                            <!-- ================= STRAIN ================= -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label">

                                    Strain

                                </label>

                                <input
                                        type="text"
                                        th:field="*{strain}"
                                        class="form-control"
                                        placeholder="Example: C57BL/6">

                            </div>



                            <!-- ================= DATE OF BIRTH ================= -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label">

                                    Date of Birth

                                </label>

                                <input
                                        type="date"
                                        th:field="*{dateOfBirth}"
                                        class="form-control">

                            </div>



                            <!-- ================= COLOR ================= -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label">

                                    Color

                                </label>

                                <input
                                        type="text"
                                        th:field="*{color}"
                                        class="form-control"
                                        placeholder="Example: White">

                            </div>



                            <!-- ================= STATUS ================= -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label">

                                    Status

                                </label>

                                <select
                                        th:field="*{status}"
                                        class="form-select">

                                    <option value="">
                                        Select Status
                                    </option>

                                    <option value="ACTIVE">
                                        Active
                                    </option>

                                    <option value="BREEDING">
                                        Breeding
                                    </option>

                                    <option value="EXPERIMENT">
                                        Experiment
                                    </option>

                                    <option value="QUARANTINE">
                                        Quarantine
                                    </option>

                                    <option value="DECEASED">
                                        Deceased
                                    </option>

                                </select>

                            </div>


                            <div class="mb-3">

                                <label for="genotype" class="form-label">
                                    Genotype
                                </label>

                                <select
                                        id="genotype"
                                        name="genotype"
                                        class="form-select"
                                        required>

                                    <option value="false">No</option>
                                    <option value="true">Yes</option>

                                </select>

                            </div>

                            <!-- ================= RFID ================= -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label">

                                    RFID

                                </label>

                                <input
                                        type="text"
                                        th:field="*{rfid}"
                                        class="form-control"
                                        placeholder="Enter RFID">

                            </div>



                            <!-- ================= BARCODE ================= -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label">

                                    Barcode

                                </label>

                                <input
                                        type="text"
                                        th:field="*{barcode}"
                                        class="form-control"
                                        placeholder="Enter Barcode">

                            </div>



                            <!-- ================= COLONY ================= -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label">

                                    Colony

                                </label>

                                <select
                                        th:field="*{colony}"
                                        class="form-select">

                                    <option value="">
                                        Select Colony
                                    </option>

                                    <option
                                            th:each="colony : ${colonies}"
                                            th:value="${colony.id}"
                                            th:text="${colony.name}">
                                    </option>

                                </select>

                            </div>



                            <!-- ================= CAGE ================= -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label">

                                    Cage

                                </label>

                                <select
                                        th:field="*{cage}"
                                        class="form-select">

                                    <option value="">
                                        Select Cage
                                    </option>

                                    <option
                                            th:each="cage : ${cages}"
                                            th:value="${cage.id}"
                                            th:text="${cage.cageNumber}">
                                    </option>

                                </select>

                            </div>



                            <!-- ================= MOTHER ================= -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label">

                                    Mother

                                </label>

                                <select
                                        th:field="*{mother}"
                                        class="form-select">

                                    <option value="">
                                        Select Mother
                                    </option>

                                    <option
                                            th:each="mother : ${femaleMice}"
                                            th:value="${mother.id}"
                                            th:text="${mother.mouseId}">
                                    </option>

                                </select>

                            </div>



                            <!-- ================= FATHER ================= -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label">

                                    Father

                                </label>

                                <select
                                        th:field="*{father}"
                                        class="form-select">

                                    <option value="">
                                        Select Father
                                    </option>

                                    <option
                                            th:each="father : ${maleMice}"
                                            th:value="${father.id}"
                                            th:text="${father.mouseId}">
                                    </option>

                                </select>

                            </div>



                            <!-- ================= CURRENT IMAGE ================= -->

                            <div
                                    class="col-md-12 mb-3"
                                    th:if="${mouse.id != null and mouse.imageUrl != null}">

                                <label class="form-label">

                                    Current Image

                                </label>

                                <div>

                                    <img
                                            th:src="${mouse.imageUrl}"
                                            alt="Mouse Image"
                                            class="img-thumbnail"
                                            style="max-width:200px; max-height:200px;">

                                </div>

                            </div>



                            <!-- ================= IMAGE ================= -->

                            <div class="col-md-12 mb-3">

                                <label class="form-label">

                                    <span th:if="${mouse.id == null}">
                                        Mouse Image
                                    </span>

                                    <span th:if="${mouse.id != null}">
                                        Change Mouse Image
                                    </span>

                                </label>

                                <input
                                        type="file"
                                        name="image"
                                        class="form-control"
                                        accept="image/*">

                                <div class="form-text">

                                    <span th:if="${mouse.id == null}">
                                        Upload an image of the mouse.
                                    </span>

                                    <span th:if="${mouse.id != null}">
                                        Leave empty to keep the current image.
                                    </span>

                                    JPG, PNG, or other image formats are supported.

                                </div>

                            </div>


                        </div>



                        <!-- ================= BUTTONS ================= -->

                        <div class="mt-4">

                            <button
                                    type="submit"
                                    class="btn btn-success me-2">

                                <span th:if="${mouse.id == null}">
                                    💾 Save Mouse
                                </span>

                                <span th:if="${mouse.id != null}">
                                    💾 Update Mouse
                                </span>

                            </button>


                            <a
                                    href="/mice"
                                    class="btn btn-secondary">

                                Cancel

                            </a>

                        </div>


                    </form>

                </div>

            </div>

        </div>

    </div>

</div>



<!-- ================= BOOTSTRAP JS ================= -->

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


</body>

</html>
