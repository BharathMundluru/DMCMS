<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>DMCMS | Colony</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

</head>


<body class="bg-light">


<!-- ================= NAVBAR ================= -->

<nav class="navbar navbar-dark"
     style="background:#16324f;">

    <div class="container">

        <a class="navbar-brand"
           href="/dashboard">

            🧬 DMCMS

        </a>


        <div>

            <a href="/dashboard"
               class="btn btn-outline-light me-2">

                Dashboard

            </a>


            <a href="/colonies"
               class="btn btn-outline-light">

                Colonies

            </a>

        </div>

    </div>

</nav>


<!-- ================= MAIN ================= -->

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow">

                <div class="card-body p-4">


                    <!-- ================= TITLE ================= -->

                    <h2 class="mb-4"
                        th:if="${colony.id == null}">

                        🧬 Add New Colony

                    </h2>


                    <h2 class="mb-4"
                        th:if="${colony.id != null}">

                        ✏️ Edit Colony

                    </h2>


                    <!-- ================= FORM ================= -->

                    <form
                            th:action="@{/colonies/save}"
                            th:object="${colony}"
                            method="post">


                        <!-- IMPORTANT:
                             Keeps ID during editing -->

                        <input
                                type="hidden"
                                th:field="*{id}">


                        <div class="row">


                            <!-- ================= NAME ================= -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label">

                                    Colony Name

                                </label>

                                <input
                                        type="text"
                                        th:field="*{name}"
                                        class="form-control"
                                        placeholder="Example: Colony A"
                                        required>

                            </div>


                            <!-- ================= PRINCIPAL INVESTIGATOR ================= -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label">

                                    Principal Investigator

                                </label>

                                <input
                                        type="text"
                                        th:field="*{principalInvestigator}"
                                        class="form-control"
                                        placeholder="Enter investigator name">

                            </div>


                            <!-- ================= PROJECT ================= -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label">

                                    Project Name

                                </label>

                                <input
                                        type="text"
                                        th:field="*{projectName}"
                                        class="form-control"
                                        placeholder="Enter project name">

                            </div>


                            <!-- ================= STATUS ================= -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label">

                                    Status

                                </label>

                                <select
                                        th:field="*{status}"
                                        class="form-select">

                                    <option value="">
                                        Select Status
                                    </option>

                                    <option value="ACTIVE">
                                        Active
                                    </option>

                                    <option value="INACTIVE">
                                        Inactive
                                    </option>

                                    <option value="COMPLETED">
                                        Completed
                                    </option>

                                </select>

                            </div>


                            <!-- ================= DESCRIPTION ================= -->

                            <div class="col-md-12 mb-3">

                                <label class="form-label">

                                    Description

                                </label>

                                <textarea
                                        th:field="*{description}"
                                        class="form-control"
                                        rows="5"
                                        placeholder="Enter colony description">
                                </textarea>

                            </div>


                        </div>


                        <!-- ================= BUTTONS ================= -->

                        <div class="mt-4">


                            <button
                                    type="submit"
                                    class="btn btn-success me-2">

                                💾
                                <span th:if="${colony.id == null}">
                                    Save Colony
                                </span>

                                <span th:if="${colony.id != null}">
                                    Update Colony
                                </span>

                            </button>


                            <a
                                    href="/colonies"
                                    class="btn btn-secondary">

                                Cancel

                            </a>


                        </div>


                    </form>

                </div>

            </div>

        </div>

    </div>

</div>


</body>

</html>
