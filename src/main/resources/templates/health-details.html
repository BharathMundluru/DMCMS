<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>DMCMS | Health Details</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

</head>

<body class="bg-light">


<!-- ================= NAVBAR ================= -->

<nav class="navbar navbar-dark"
     style="background:#16324f;">

    <div class="container">

        <a class="navbar-brand"
           href="/dashboard">

            🐭 DMCMS

        </a>

        <a
                href="/health"
                class="btn btn-outline-light">

            Back to Health Records

        </a>

    </div>

</nav>


<!-- ================= MAIN ================= -->

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-body p-4">


            <div class="d-flex justify-content-between align-items-center mb-4">

                <h2>

                    🩺 Health Record Details

                </h2>

                <a
                        th:href="@{/health/edit/{id}(id=${healthRecord.id})}"
                        class="btn btn-warning">

                    ✏️ Edit

                </a>

            </div>


            <div class="row">


                <!-- ================= MOUSE ================= -->

                <div class="col-md-6 mb-3">

                    <strong>

                        Mouse:

                    </strong>

                    <span
                            th:if="${healthRecord.mouse != null}"
                            th:text="${healthRecord.mouse.mouseId}">

                        M001

                    </span>

                    <span
                            th:unless="${healthRecord.mouse != null}">

                        Not assigned

                    </span>

                </div>


                <!-- ================= DATE ================= -->

                <div class="col-md-6 mb-3">

                    <strong>

                        Record Date:

                    </strong>

                    <span th:text="${healthRecord.recordDate}">

                        -

                    </span>

                </div>


                <!-- ================= CONDITION ================= -->

                <div class="col-md-6 mb-3">

                    <strong>

                        Condition:

                    </strong>

                    <span th:text="${healthRecord.condition}">

                        -

                    </span>

                </div>


                <!-- ================= STATUS ================= -->

                <div class="col-md-6 mb-3">

                    <strong>

                        Status:

                    </strong>

                    <span th:text="${healthRecord.status}">

                        -

                    </span>

                </div>


            </div>


            <hr>


            <!-- ================= SYMPTOMS ================= -->

            <div class="mb-4">

                <h5>

                    Symptoms

                </h5>

                <p
                        class="text-muted"
                        th:text="${healthRecord.symptoms}">

                    No symptoms recorded.

                </p>

            </div>


            <!-- ================= DIAGNOSIS ================= -->

            <div class="mb-4">

                <h5>

                    Diagnosis

                </h5>

                <p
                        class="text-muted"
                        th:text="${healthRecord.diagnosis}">

                    No diagnosis recorded.

                </p>

            </div>


            <!-- ================= TREATMENT ================= -->

            <div class="mb-4">

                <h5>

                    Treatment

                </h5>

                <p
                        class="text-muted"
                        th:text="${healthRecord.treatment}">

                    No treatment recorded.

                </p>

            </div>


            <!-- ================= VETERINARIAN ================= -->

            <div class="mb-4">

                <h5>

                    Veterinarian

                </h5>

                <p
                        class="text-muted"
                        th:text="${healthRecord.veterinarian}">

                    -

                </p>

            </div>


            <!-- ================= NOTES ================= -->

            <div class="mb-4">

                <h5>

                    Notes

                </h5>

                <p
                        class="text-muted"
                        th:text="${healthRecord.notes}">

                    No additional notes.

                </p>

            </div>


            <!-- ================= BUTTONS ================= -->

            <div class="mt-4">

                <a
                        href="/health"
                        class="btn btn-secondary">

                    Back

                </a>

                <a
                        th:href="@{/health/edit/{id}(id=${healthRecord.id})}"
                        class="btn btn-warning">

                    Edit

                </a>

                <a
                        th:href="@{/health/delete/{id}(id=${healthRecord.id})}"
                        class="btn btn-danger"
                        onclick="return confirm('Are you sure you want to delete this health record?');">

                    Delete

                </a>

            </div>

        </div>

    </div>

</div>


</body>

</html>
