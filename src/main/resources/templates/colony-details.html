<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>DMCMS | Colony Details</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

</head>


<body class="bg-light">


<!-- ================= NAVBAR ================= -->

<nav class="navbar navbar-dark"
     style="background:#16324f;">

    <div class="container">

        <a class="navbar-brand"
           href="/dashboard">

            🧬 DMCMS

        </a>


        <a
                href="/colonies"
                class="btn btn-outline-light">

            Back to Colonies

        </a>

    </div>

</nav>


<!-- ================= MAIN ================= -->

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-body p-4">


            <h2 class="mb-4">

                🧬 Colony Details

            </h2>


            <div class="row">


                <!-- ================= LEFT ================= -->

                <div class="col-md-6">


                    <p>

                        <strong>ID:</strong>

                        <span
                                th:text="${colony.id}">

                            1

                        </span>

                    </p>


                    <p>

                        <strong>Colony Name:</strong>

                        <span
                                th:text="${colony.name}">

                            Colony A

                        </span>

                    </p>


                    <p>

                        <strong>Principal Investigator:</strong>

                        <span
                                th:text="${colony.principalInvestigator}">

                            Dr. Smith

                        </span>

                    </p>


                </div>


                <!-- ================= RIGHT ================= -->

                <div class="col-md-6">


                    <p>

                        <strong>Project Name:</strong>

                        <span
                                th:text="${colony.projectName}">

                            Research Project

                        </span>

                    </p>


                    <p>

                        <strong>Status:</strong>

                        <span
                                class="badge bg-success"
                                th:text="${colony.status}">

                            ACTIVE

                        </span>

                    </p>


                </div>


            </div>


            <hr>


            <!-- ================= DESCRIPTION ================= -->

            <h5>

                Description

            </h5>


            <div
                    class="border rounded p-3 bg-light">

                <p
                        class="mb-0"
                        th:if="${colony.description != null
                                and !#strings.isEmpty(colony.description)}"
                        th:text="${colony.description}">

                    Colony description

                </p>


                <p
                        class="text-muted mb-0"
                        th:unless="${colony.description != null
                                   and !#strings.isEmpty(colony.description)}">

                    No description provided.

                </p>

            </div>


            <!-- ================= BUTTONS ================= -->

            <div class="mt-4">


                <a
                        th:href="@{/colonies/edit/{id}(id=${colony.id})}"
                        class="btn btn-warning">

                    ✏️ Edit Colony

                </a>


                <a
                        href="/colonies"
                        class="btn btn-secondary">

                    Back

                </a>


                <a
                        th:href="@{/colonies/delete/{id}(id=${colony.id})}"
                        class="btn btn-danger"
                        onclick="return confirm('Are you sure you want to delete this colony?');">

                    Delete

                </a>


            </div>


        </div>

    </div>

</div>


</body>

</html>
