<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>DMCMS | Colonies</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

</head>


<body class="bg-light">


<!-- ================= NAVBAR ================= -->

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg" style="background:#16324f;">

    <div class="container">

        <!-- Logo / Brand -->
        <a class="navbar-brand fw-bold text-white"
           href="/dashboard">

            🐭 DMCMS

        </a>

        <!-- Navigation Links -->
        <div class="navbar-nav ms-auto">

            <a class="nav-link text-white"
               href="/dashboard">

                Dashboard

            </a>

            <a class="nav-link text-white"
               href="/mice">

                Mice

            </a>

            <a class="nav-link text-white"
               href="/colonies">

                Colonies

            </a>

            <a class="nav-link text-white"
               href="/cages">

                Cages

            </a>

            <a class="nav-link text-white"
               href="/breeding">

                Breeding

            </a>

            <a class="nav-link text-white"
               href="/health">

                Health

            </a>

            <a class="nav-link text-white"
               href="/inventory">

                Inventory

            </a>

            <a class="nav-link text-white"
               href="/experiments">

                Experiments

            </a>

        </div>

    </div>

</nav>


<!-- ================= MAIN ================= -->

<div class="container-fluid mt-4">

    <div class="card shadow">

        <div class="card-body">


            <div class="d-flex justify-content-between
                        align-items-center mb-4">

                <h2>

                    🧬 Colonies

                </h2>


                <a
                        href="/colonies/add"
                        class="btn btn-success">

                    + Add Colony

                </a>

            </div>


            <!-- ================= TABLE ================= -->

            <div class="table-responsive">

                <table
                        class="table table-hover
                               table-bordered align-middle">


                    <thead class="table-dark">

                    <tr>

                        <th>ID</th>

                        <th>Colony Name</th>

                        <th>Principal Investigator</th>

                        <th>Project Name</th>

                        <th>Status</th>

                        <th>Description</th>

                        <th>Actions</th>

                    </tr>

                    </thead>


                    <tbody>


                    <tr th:each="colony : ${colonies}">


                        <!-- ID -->

                        <td
                                th:text="${colony.id}">

                            1

                        </td>


                        <!-- NAME -->

                        <td>

                            <strong
                                    th:text="${colony.name}">

                                Colony A

                            </strong>

                        </td>


                        <!-- PI -->

                        <td
                                th:text="${colony.principalInvestigator}">

                            Dr. Smith

                        </td>


                        <!-- PROJECT -->

                        <td
                                th:text="${colony.projectName}">

                            Research Project

                        </td>


                        <!-- STATUS -->

                        <td>

                            <span
                                    class="badge bg-success"
                                    th:if="${colony.status == 'ACTIVE'}"
                                    th:text="${colony.status}">

                                ACTIVE

                            </span>


                            <span
                                    class="badge bg-secondary"
                                    th:unless="${colony.status == 'ACTIVE'}"
                                    th:text="${colony.status}">

                                INACTIVE

                            </span>

                        </td>


                        <!-- DESCRIPTION -->

                        <td
                                th:text="${colony.description}">

                            Description

                        </td>


                        <!-- ACTIONS -->

                        <td>

                            <a
                                    th:href="@{/colonies/view/{id}(id=${colony.id})}"
                                    class="btn btn-primary btn-sm">

                                View

                            </a>


                            <a
                                    th:href="@{/colonies/edit/{id}(id=${colony.id})}"
                                    class="btn btn-warning btn-sm">

                                Edit

                            </a>


                            <a
                                    th:href="@{/colonies/delete/{id}(id=${colony.id})}"
                                    class="btn btn-danger btn-sm"
                                    onclick="return confirm('Are you sure you want to delete this colony?');">

                                Delete

                            </a>

                        </td>


                    </tr>


                    <!-- ================= NO DATA ================= -->

                    <tr
                            th:if="${#lists.isEmpty(colonies)}">

                        <td
                                colspan="7"
                                class="text-center py-4">

                            No colonies found.

                            <br>

                            <a
                                    href="/colonies/add"
                                    class="btn btn-success mt-2">

                                Add First Colony

                            </a>

                        </td>

                    </tr>


                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>


</body>

</html>
