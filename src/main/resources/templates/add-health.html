<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>DMCMS | Health Record</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

</head>

<body class="bg-light">


<!-- ================= NAVBAR ================= -->

<nav class="navbar navbar-dark"
     style="background:#16324f;">

    <div class="container">

        <a class="navbar-brand"
           href="/dashboard">

            🐭 DMCMS

        </a>

        <div>

            <a href="/dashboard"
               class="btn btn-outline-light me-2">

                Dashboard

            </a>

            <a href="/health"
               class="btn btn-outline-light">

                Health Records

            </a>

        </div>

    </div>

</nav>


<!-- ================= MAIN ================= -->

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-lg-9">

            <div class="card shadow">

                <div class="card-body p-4">


                    <!-- ================= TITLE ================= -->

                    <h2 class="mb-4">

                        🩺

                        <span th:if="${healthRecord.id == null}">
                            Add Health Record
                        </span>

                        <span th:unless="${healthRecord.id == null}">
                            Edit Health Record
                        </span>

                    </h2>


                    <!-- ================= FORM ================= -->

                    <form
                            th:action="${healthRecord.id == null}
                                ? @{/health/save}
                                : @{/health/update/{id}(id=${healthRecord.id})}"
                            th:object="${healthRecord}"
                            method="post">


                        <div class="row">


                            <!-- ================= MOUSE ================= -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label">

                                    Mouse

                                </label>

                                <select
                                        th:field="*{mouse}"
                                        class="form-select"
                                        required>

                                    <option value="">

                                        Select Mouse

                                    </option>

                                    <option
                                            th:each="mouse : ${mice}"
                                            th:value="${mouse.id}"
                                            th:text="${mouse.mouseId}">

                                    </option>

                                </select>

                            </div>


                            <!-- ================= RECORD DATE ================= -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label">

                                    Record Date

                                </label>

                                <input
                                        type="date"
                                        th:field="*{recordDate}"
                                        class="form-control"
                                        required>

                            </div>


                            <!-- ================= CONDITION ================= -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label">

                                    Condition

                                </label>

                                <input
                                        type="text"
                                        th:field="*{condition}"
                                        class="form-control"
                                        placeholder="Example: Skin infection">

                            </div>


                            <!-- ================= STATUS ================= -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label">

                                    Status

                                </label>

                                <select
                                        th:field="*{status}"
                                        class="form-select">

                                    <option value="">

                                        Select Status

                                    </option>

                                    <option value="HEALTHY">

                                        Healthy

                                    </option>

                                    <option value="UNDER_TREATMENT">

                                        Under Treatment

                                    </option>

                                    <option value="CRITICAL">

                                        Critical

                                    </option>

                                    <option value="RECOVERED">

                                        Recovered

                                    </option>

                                    <option value="DECEASED">

                                        Deceased

                                    </option>

                                </select>

                            </div>


                            <!-- ================= SYMPTOMS ================= -->

                            <div class="col-md-12 mb-3">

                                <label class="form-label">

                                    Symptoms

                                </label>

                                <textarea
                                        th:field="*{symptoms}"
                                        class="form-control"
                                        rows="3"
                                        placeholder="Describe observed symptoms">

                                </textarea>

                            </div>


                            <!-- ================= DIAGNOSIS ================= -->

                            <div class="col-md-12 mb-3">

                                <label class="form-label">

                                    Diagnosis

                                </label>

                                <textarea
                                        th:field="*{diagnosis}"
                                        class="form-control"
                                        rows="3"
                                        placeholder="Enter diagnosis">

                                </textarea>

                            </div>


                            <!-- ================= TREATMENT ================= -->

                            <div class="col-md-12 mb-3">

                                <label class="form-label">

                                    Treatment

                                </label>

                                <textarea
                                        th:field="*{treatment}"
                                        class="form-control"
                                        rows="3"
                                        placeholder="Enter treatment or medication">

                                </textarea>

                            </div>


                            <!-- ================= VETERINARIAN ================= -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label">

                                    Veterinarian

                                </label>

                                <input
                                        type="text"
                                        th:field="*{veterinarian}"
                                        class="form-control"
                                        placeholder="Veterinarian name">

                            </div>


                            <!-- ================= NOTES ================= -->

                            <div class="col-md-12 mb-3">

                                <label class="form-label">

                                    Notes

                                </label>

                                <textarea
                                        th:field="*{notes}"
                                        class="form-control"
                                        rows="4"
                                        placeholder="Additional notes">

                                </textarea>

                            </div>

                        </div>


                        <!-- ================= BUTTONS ================= -->

                        <div class="mt-4">

                            <button
                                    type="submit"
                                    class="btn btn-success me-2">

                                <span
                                        th:if="${healthRecord.id == null}">

                                    💾 Save Health Record

                                </span>

                                <span
                                        th:unless="${healthRecord.id == null}">

                                    ✏️ Update Health Record

                                </span>

                            </button>


                            <a
                                    href="/health"
                                    class="btn btn-secondary">

                                Cancel

                            </a>

                        </div>


                    </form>

                </div>

            </div>

        </div>

    </div>

</div>


</body>

</html>
