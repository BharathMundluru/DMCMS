<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Register | DMCMS</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <style>

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #eef7f1, #dcefe3);
        }

        .register-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .register-card {
            width: 100%;
            max-width: 480px;
            border: none;
            border-radius: 15px;
            overflow: hidden;
        }

        .register-header {
            background: #198754;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .register-header h2 {
            margin: 0;
            font-weight: 600;
        }

        .register-header p {
            margin: 8px 0 0;
            opacity: 0.9;
        }

        .form-control {
            padding: 12px;
            border-radius: 8px;
        }

        .form-control:focus {
            border-color: #198754;
            box-shadow: 0 0 0 0.2rem rgba(25, 135, 84, 0.15);
        }

        .register-btn {
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
        }

        .login-link {
            text-decoration: none;
            color: #198754;
            font-weight: 500;
        }

        .login-link:hover {
            text-decoration: underline;
        }

    </style>

</head>

<body>

<div class="container register-container">

    <div class="card shadow register-card">

        <!-- Header -->

        <div class="register-header">

            <h2>DMCMS</h2>

            <p>
                Digital Mouse Colony Management System
            </p>

        </div>


        <!-- Form Body -->

        <div class="card-body p-4">

            <h4 class="text-center mb-4">
                Create Researcher Account
            </h4>


            <!-- Error Message -->

            <div
                    th:if="${error}"
                    class="alert alert-danger"
                    role="alert"
                    th:text="${error}">
            </div>


            <!-- Registration Form -->

            <form
                    th:action="@{/register}"
                    method="post">

                <!-- CSRF Token -->

                <input
                        type="hidden"
                        th:name="${_csrf.parameterName}"
                        th:value="${_csrf.token}">


                <!-- Username -->

                <div class="mb-3">

                    <label
                            for="username"
                            class="form-label">

                        Username

                    </label>

                    <input
                            type="text"
                            id="username"
                            name="username"
                            class="form-control"
                            placeholder="Enter username"
                            autocomplete="username"
                            required>

                </div>


                <!-- Email -->

                <div class="mb-3">

                    <label
                            for="email"
                            class="form-label">

                        Email

                    </label>

                    <input
                            type="email"
                            id="email"
                            name="email"
                            class="form-control"
                            placeholder="Enter email address"
                            autocomplete="email"
                            required>

                </div>


                <!-- Password -->

                <div class="mb-3">

                    <label
                            for="password"
                            class="form-label">

                        Password

                    </label>

                    <input
                            type="password"
                            id="password"
                            name="password"
                            class="form-control"
                            placeholder="Enter password"
                            minlength="8"
                            autocomplete="new-password"
                            required>

                    <div class="form-text">
                        Password must contain at least 8 characters.
                    </div>

                </div>


                <!-- Role Information -->

                <div class="alert alert-info">

                    <strong>Account type:</strong>
                    Researcher

                    <br>

                    New accounts are registered as
                    <strong>RESEARCHER</strong>.

                </div>


                <!-- Register Button -->

                <button
                        type="submit"
                        class="btn btn-success w-100 register-btn">

                    Create Account

                </button>

            </form>


            <!-- Login Link -->

            <div class="text-center mt-4">

                <span>
                    Already have an account?
                </span>

                <a
                        th:href="@{/login}"
                        class="login-link">

                    Login here

                </a>

            </div>

        </div>

    </div>

</div>


<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
