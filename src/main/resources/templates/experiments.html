<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>DMCMS | Experiments</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <style>

        body {
            background-color: #f4f7f9;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background: #16324f;
        }

        .navbar-brand {
            font-weight: bold;
            color: white !important;
        }

        .navbar .nav-link {
            color: #dce6ef !important;
        }

        .navbar .nav-link:hover {
            color: white !important;
        }

        .page-title {
            margin-top: 40px;
            color: #16324f;
            font-weight: bold;
        }

        .table-container {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            margin-top: 25px;
            margin-bottom: 40px;
        }

        .table th {
            background-color: #16324f;
            color: white;
        }

    </style>

</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg" style="background:#16324f;">

    <div class="container">

        <!-- Logo / Brand -->
        <a class="navbar-brand fw-bold text-white"
           href="/dashboard">

            🐭 DMCMS

        </a>

        <!-- Navigation Links -->
        <div class="navbar-nav ms-auto">

            <a class="nav-link text-white"
               href="/dashboard">

                Dashboard

            </a>

            <a class="nav-link text-white"
               href="/mice">

                Mice

            </a>

            <a class="nav-link text-white"
               href="/colonies">

                Colonies

            </a>

            <a class="nav-link text-white"
               href="/cages">

                Cages

            </a>

            <a class="nav-link text-white"
               href="/breeding">

                Breeding

            </a>

            <a class="nav-link text-white"
               href="/health">

                Health

            </a>

            <a class="nav-link text-white"
               href="/inventory">

                Inventory

            </a>

            <a class="nav-link text-white"
               href="/experiments">

                Experiments

            </a>

        </div>

    </div>

</nav>


<div class="container">

    <div class="d-flex justify-content-between align-items-center">

        <h1 class="page-title">

            Experiments

        </h1>

        <a href="/experiments/add"
           class="btn btn-primary">

            + Add Experiment

        </a>

    </div>


    <div class="table-container">

        <table class="table table-hover align-middle">

            <thead>

            <tr>

                <th>ID</th>

                <th>Mouse</th>

                <th>Project Name</th>

                <th>Protocol Number</th>

                <th>Researcher</th>

                <th>Start Date</th>

                <th>End Date</th>

                <th>Status</th>

                <th>Action</th>

            </tr>

            </thead>

            <tbody>

            <tr th:each="experiment : ${experiments}">

                <td th:text="${experiment.id}">
                    1
                </td>

                <td th:text="${experiment.mouse.mouseId}">
                    M001
                </td>

                <td th:text="${experiment.projectName}">
                    Project A
                </td>

                <td th:text="${experiment.protocolNumber}">
                    P-001
                </td>

                <td th:text="${experiment.researcher}">
                    Researcher
                </td>

                <td th:text="${experiment.startDate}">
                    2026-08-21
                </td>

                <td th:text="${experiment.endDate}">
                    2026-09-21
                </td>

                <td th:text="${experiment.status}">
                    ACTIVE
                </td>

                <td>

                    <a
                            th:href="@{/experiments/view/{id}(id=${experiment.id})}"
                            class="btn btn-sm btn-primary">

                        View

                    </a>

                    <a
                            th:href="@{/experiments/delete/{id}(id=${experiment.id})}"
                            class="btn btn-sm btn-danger"
                            onclick="return confirm('Delete this experiment?');">

                        Delete

                    </a>

                </td>

            </tr>


            <tr th:if="${#lists.isEmpty(experiments)}">

                <td colspan="9"
                    class="text-center text-muted">

                    No experiments found.

                </td>

            </tr>

            </tbody>

        </table>

    </div>

</div>

</body>

</html>
